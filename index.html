<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow p-4" style="width: 450px;">
            <h2 class="text-center mb-4">BMI CALCULATOR</h2>
            <div class="mb-3">
                <label class="form-label">Weight (KG)</label>
                <input id="weightInput"
                    type="number"
                    class="form-control"
                    placeholder="Enter your weight in kg"
                    step="any">
            </div>
            <div class="mb-3">
                <label class="form-label">Height (Meter)</label>
                <input
                    id="heightInput"
                    type="number"
                    class="form-control"
                    placeholder="Enter your height in meters"
                    step="any">
            </div>
            <div class="bg-light border rounded p-3 text-center my-3">
                <h5>Your BMI Result</h5>
                <h2 id="bmiResult" class="fw-bold">--</h2>
                <h5 id="bmiCategory" class="text-secondary">Waiting for calculation</h5>
            </div>
            <div class="d-flex justify-content-between gap-3">
                <button
                    onclick="calculateOnClick()"
                    class="btn btn-primary w-50">Calculate</button>
                <button
                    onclick="deleteOnClick()"
                    class="btn btn-danger w-50">Delete</button>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
